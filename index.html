<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Advanced Glass Air Hockey</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Mobile browsers par dynamic URL bars ke sath perfect fit ke liye dvh ka use */
            height: 100dvh; 
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #13151a 0%, #1e222d 50%, #111827 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            perspective: 1200px;
            /* Browser gestures, pull-to-refresh, aur text highlighting ko rokein */
            overscroll-behavior: none; 
            touch-action: none; 
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        /* Glass Panel Styles - Ab puri tarah se responsive hai */
        .panel {
            width: 100%;
            height: 100%;
            max-width: 500px;
            max-height: 900px;
            border-radius: 48px;
            position: relative;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.05) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-top: 2px solid rgba(255, 255, 255, 0.4);
            border-left: 2px solid rgba(255, 255, 255, 0.4);
            box-shadow: 
                0 30px 60px -15px rgba(0, 0, 0, 0.5),
                inset 2px 2px 15px rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden; 
        }

        /* Chhote mobile screens par full bleed (Bina borders ke) */
        @media (max-width: 600px) {
            .panel {
                border-radius: 0;
                max-width: 100%;
                max-height: 100%;
                border: none;
            }
        }

        #game-container {
            width: 100%;
            height: 100%; 
            position: relative;
            flex-grow: 1;
        }

        canvas {
            display: block;
            outline: none;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* UI Overlays (Menus) */
        .game-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(10, 15, 25, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 20;
            transition: opacity 0.4s ease;
            padding: 0 40px;
        }

        .game-ui.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .game-title {
            font-size: 42px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0px 0px 20px rgba(0,212,255,0.6);
            letter-spacing: -1px;
            margin-bottom: 8px;
            text-align: center;
        }

        .game-subtitle {
            font-size: 15px;
            color: #cbd5e1;
            font-weight: 500;
            margin-bottom: 40px;
            text-align: center;
            line-height: 1.6;
        }

        .score-display {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .score-display.visible {
            opacity: 1;
        }
        
        .score-text {
            position: absolute;
            width: 100%;
            text-align: center;
            font-size: 100px;
            font-weight: 900;
            opacity: 0.15;
        }

        /* Player 2 ka score ulta hona chahiye (Top par) */
        .p2-score { 
            color: #ff0055; 
            top: 15%;
            transform: rotate(180deg);
            text-shadow: 0 0 30px rgba(255,0,85,0.8);
        }
        
        /* Player 1 ka score seedha (Bottom par) */
        .p1-score { 
            color: #00d4ff; 
            bottom: 15%;
            text-shadow: 0 0 30px rgba(0,212,255,0.8);
        }

        /* Start/Resume Button ki styling */
        .glass-btn {
            width: 100%;
            max-width: 300px;
            height: 64px;
            border-radius: 32px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0.05) 100%);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.6);
            border-left: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 
                0 10px 25px -5px rgba(0, 0, 0, 0.3),
                inset 2px 2px 10px rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .glass-btn:active {
            transform: scale(0.95);
            background: rgba(255,255,255,0.1);
        }

        /* Beech mein Pause Button ki styling */
        .pause-btn {
            position: absolute;
            top: 50%;
            right: 15px;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            cursor: pointer;
            z-index: 15;
            transition: all 0.2s;
            opacity: 0;
            pointer-events: none;
        }

        .pause-btn.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .pause-btn:active {
            transform: translateY(-50%) scale(0.9);
        }

    </style>
</head>
<body>

    <div class="panel">
        <div id="game-container">
            <!-- Scores dikhane ke liye -->
            <div id="score-container" class="score-display">
                <div id="p2-score-text" class="score-text p2-score">0</div>
                <div id="p1-score-text" class="score-text p1-score">0</div>
            </div>
            
            <!-- In-game pause button -->
            <button class="pause-btn" id="pause-btn">⏸</button>
            
            <!-- Main Game Canvas -->
            <canvas id="gameCanvas"></canvas>
            
            <!-- Menus aur Instructions -->
            <div id="game-ui" class="game-ui">
                <h2 class="game-title">Glass<br>Hockey</h2>
                <p class="game-subtitle" id="game-sub">
                    <b style="color:#ff0055">Player 2</b> (Upar Wala Hissa)<br>
                    <b style="color:#00d4ff">Player 1</b> (Neeche Wala Hissa)<br><br>
                    Device ko seedha rakhein. Pehle 7 goals wala jitega!
                </p>
                <button class="glass-btn" id="start-btn">Khel Shuru Karein</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // RESPONSIVE GAME SETUP & PHYSICS ENGINE
        // ==========================================
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); 
        const gameContainer = document.getElementById('game-container');
        
        let gameActive = false;
        let animationId;
        let goalWidth = 140;
        const friction = 0.985;
        let timeCount = 0;

        // Pointer IDs ko globally define kiya hai taki har jagah access ho sake
        let p1PointerId = null;
        let p2PointerId = null;
        
        // Dynamic Physics Objects (Puck mein ab color property hai)
        const puck = { x: 0, y: 0, vx: 0, vy: 0, r: 18, baseSpeed: 8, trail: [], color: '#ffffff' };
        
        const p1 = { 
            x: 0, y: 0, targetX: 0, targetY: 0, 
            vx: 0, vy: 0, r: 32, score: 0, 
            color: '#00d4ff', bounds: { top: 0, bottom: 0 }
        };
        
        const p2 = { 
            x: 0, y: 0, targetX: 0, targetY: 0, 
            vx: 0, vy: 0, r: 32, score: 0, 
            color: '#ff0055', bounds: { top: 0, bottom: 0 }
        };

        let sparks = [];

        // UI Elements
        const uiOverlay = document.getElementById('game-ui');
        const scoreContainer = document.getElementById('score-container');
        const p1ScoreTxt = document.getElementById('p1-score-text');
        const p2ScoreTxt = document.getElementById('p2-score-text');
        const startBtn = document.getElementById('start-btn');
        const gameSub = document.getElementById('game-sub');
        const pauseBtn = document.getElementById('pause-btn');

        // --- Responsive Resizer (Screen size ke hisab se game ko set karta hai) ---
        function resize() {
            canvas.width = gameContainer.clientWidth;
            canvas.height = gameContainer.clientHeight;
            
            const midY = canvas.height / 2;
            const midX = canvas.width / 2;
            
            goalWidth = Math.max(120, canvas.width * 0.4);
            
            p1.bounds = { top: midY, bottom: canvas.height };
            p2.bounds = { top: 0, bottom: midY };
            
            if (!gameActive && p1.score === 0 && p2.score === 0) {
                p1.x = midX; p1.y = canvas.height - 100;
                p2.x = midX; p2.y = 100;
                p1.targetX = p1.x; p1.targetY = p1.y;
                p2.targetX = p2.x; p2.targetY = p2.y;
                puck.x = midX; puck.y = midY;
            }
        }

        window.addEventListener('resize', resize);
        resize(); // Game shuru hone se pehle initial sizing

        // --- Particle System (Chingariyan banane ke liye) ---
        function createSparks(x, y, color) {
            for(let i=0; i<15; i++) {
                sparks.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 14, 
                    vy: (Math.random() - 0.5) * 14,
                    life: 1.0, 
                    color: color,
                    size: Math.random() * 3 + 1
                });
            }
        }

        function updateSparks() {
            for(let i = sparks.length - 1; i >= 0; i--) {
                let s = sparks[i];
                s.x += s.vx;
                s.y += s.vy;
                s.vx *= 0.94; // Hawa ka dabav (Air resistance)
                s.vy *= 0.94;
                s.life -= 0.04;
                if(s.life <= 0) sparks.splice(i, 1);
            }
        }

        // --- Game Logic ---
        function resetPuck(scorer) {
            const midX = canvas.width / 2;

            // Puck ko centre mein wapas layein
            puck.x = midX;
            puck.y = canvas.height / 2;
            puck.vx = 0;
            puck.vy = scorer === 1 ? -puck.baseSpeed : puck.baseSpeed;
            puck.trail = []; 

            // Dono players (strikers) ko unki original jagah par reset karein jab goal ho
            p1.x = midX; p1.y = canvas.height - 100;
            p1.targetX = p1.x; p1.targetY = p1.y;
            p1.vx = 0; p1.vy = 0;

            p2.x = midX; p2.y = 100;
            p2.targetX = p2.x; p2.targetY = p2.y;
            p2.vx = 0; p2.vy = 0;

            // Touch pointers ko clear kar de taki game screen teleportation bug na aaye (khiladi ko firse touch karna padega)
            p1PointerId = null;
            p2PointerId = null;
        }

        function startGame() {
            uiOverlay.classList.add('hidden');
            scoreContainer.classList.add('visible');
            pauseBtn.classList.add('visible');
            
            p1.score = 0; p2.score = 0;
            p1ScoreTxt.innerText = 0; p2ScoreTxt.innerText = 0;
            
            sparks = [];
            // Randomly kisi ek player ko puck serve karein
            resetPuck(Math.random() > 0.5 ? 1 : 2); 
            
            gameActive = true;
            cancelAnimationFrame(animationId);
            loop();
        }

        function pauseGame() {
            gameActive = false;
            uiOverlay.classList.remove('hidden');
            pauseBtn.classList.remove('visible');
            document.querySelector('.game-title').innerText = "Ruka Hua (Paused)";
            gameSub.innerText = "";
            startBtn.innerText = "Khel Jari Rakhein (Resume)";
            cancelAnimationFrame(animationId);
        }

        function gameOver(winner) {
            gameActive = false;
            uiOverlay.classList.remove('hidden');
            pauseBtn.classList.remove('visible');
            document.querySelector('.game-title').innerText = "Game Khatam!";
            gameSub.innerHTML = winner === 1 
                ? "<span style='color:#00d4ff; font-size:24px; font-weight:bold;'>Player 1 Jeet Gaya!</span>" 
                : "<span style='color:#ff0055; font-size:24px; font-weight:bold;'>Player 2 Jeet Gaya!</span>";
            startBtn.innerText = "Fir se Kheliye (Rematch)";
            cancelAnimationFrame(animationId);
        }

        // --- Keyboard Integration (Desktop par khelne ke liye) ---
        const keys = {};
        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);

        function applyKeyboardInput() {
            const speed = 16; 
            // Player 2 (Upar) WASD ka upyog karta hai
            if (keys['w'] || keys['W']) updatePointerTarget(p2, p2.targetX, p2.targetY - speed);
            if (keys['s'] || keys['S']) updatePointerTarget(p2, p2.targetX, p2.targetY + speed);
            if (keys['a'] || keys['A']) updatePointerTarget(p2, p2.targetX - speed, p2.targetY);
            if (keys['d'] || keys['D']) updatePointerTarget(p2, p2.targetX + speed, p2.targetY);
            
            // Player 1 (Neeche) Arrow keys ka upyog karta hai
            if (keys['ArrowUp']) updatePointerTarget(p1, p1.targetX, p1.targetY - speed);
            if (keys['ArrowDown']) updatePointerTarget(p1, p1.targetX, p1.targetY + speed);
            if (keys['ArrowLeft']) updatePointerTarget(p1, p1.targetX - speed, p1.targetY);
            if (keys['ArrowRight']) updatePointerTarget(p1, p1.targetX + speed, p1.targetY);
        }

        // --- Physics Math (Takarane par kya hoga) ---
        function resolveCollision(striker, puckObj) {
            let dx = puckObj.x - striker.x;
            let dy = puckObj.y - striker.y;
            let distance = Math.hypot(dx, dy);
            
            if (distance < puckObj.r + striker.r) {
                let angle = Math.atan2(dy, dx);
                
                let overlap = (puckObj.r + striker.r) - distance;
                puckObj.x += Math.cos(angle) * overlap;
                puckObj.y += Math.sin(angle) * overlap;

                let hitForce = 1.25;
                puckObj.vx += (striker.vx * 0.9) + Math.cos(angle) * hitForce;
                puckObj.vy += (striker.vy * 0.9) + Math.sin(angle) * hitForce;
                
                // Takarane par chingariyan (sparks) banayein
                createSparks(puckObj.x - Math.cos(angle)*puckObj.r, puckObj.y - Math.sin(angle)*puckObj.r, striker.color);
                
                let speed = Math.hypot(puckObj.vx, puckObj.vy);
                const maxSpeed = 30;
                if(speed > maxSpeed) {
                    puckObj.vx = (puckObj.vx / speed) * maxSpeed;
                    puckObj.vy = (puckObj.vy / speed) * maxSpeed;
                }
            }
        }

        function checkPuckBoundaries() {
            // Left aur Right deewarein
            if (puck.x - puck.r < 0) { 
                puck.x = puck.r; puck.vx *= -0.8; 
                createSparks(puck.x, puck.y, puck.color); 
            }
            if (puck.x + puck.r > canvas.width) { 
                puck.x = canvas.width - puck.r; puck.vx *= -0.8; 
                createSparks(puck.x, puck.y, puck.color); 
            }
            
            const isGoal = puck.x > (canvas.width/2 - goalWidth/2) && puck.x < (canvas.width/2 + goalWidth/2);
            
            // Top Goal / Deewar
            if (puck.y - puck.r < 0) {
                if (isGoal) {
                    p1.score++; p1ScoreTxt.innerText = p1.score;
                    createSparks(puck.x, puck.y, '#00d4ff');
                    if(p1.score >= 7) gameOver(1); else resetPuck(1);
                } else {
                    puck.y = puck.r; puck.vy *= -0.8; 
                    createSparks(puck.x, puck.y, puck.color);
                }
            }
            
            // Bottom Goal / Deewar
            if (puck.y + puck.r > canvas.height) {
                if (isGoal) {
                    p2.score++; p2ScoreTxt.innerText = p2.score;
                    createSparks(puck.x, puck.y, '#ff0055');
                    if(p2.score >= 7) gameOver(2); else resetPuck(2);
                } else {
                    puck.y = canvas.height - puck.r; puck.vy *= -0.8;
                    createSparks(puck.x, puck.y, puck.color);
                }
            }
        }

        function update() {
            timeCount += 0.05;

            // Puck ke liye ek dynamic color set karein jo time ke sath badalta hai
            puck.color = `hsl(${(timeCount * 60) % 360}, 100%, 65%)`;
            
            applyKeyboardInput();

            p1.vx = (p1.targetX - p1.x) * 0.35;
            p1.vy = (p1.targetY - p1.y) * 0.35;
            p1.x += p1.vx; p1.y += p1.vy;
            
            p2.vx = (p2.targetX - p2.x) * 0.35;
            p2.vy = (p2.targetY - p2.y) * 0.35;
            p2.x += p2.vx; p2.y += p2.vy;

            puck.x += puck.vx;
            puck.y += puck.vy;
            puck.vx *= friction;
            puck.vy *= friction;
            
            puck.trail.push({x: puck.x, y: puck.y});
            if(puck.trail.length > 20) puck.trail.shift();

            checkPuckBoundaries();

            resolveCollision(p1, puck);
            resolveCollision(p2, puck);
            
            if (gameActive) checkPuckBoundaries();
            
            updateSparks();
        }

        // --- Rendering (Graphics Draw Karna) ---
        function drawGlowingCircle(x, y, r, color, isStriker) {
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            
            // Andar ka hissa (Core)
            ctx.fillStyle = isStriker ? 'rgba(255, 255, 255, 0.1)' : 'rgba(255, 255, 255, 0.8)';
            ctx.fill();
            
            // Chamakta hua border (Glowing border)
            ctx.lineWidth = isStriker ? 4 : 2;
            ctx.strokeStyle = color;
            ctx.shadowBlur = isStriker ? 20 : (15 + Math.sin(timeCount * 10) * 10);
            ctx.shadowColor = color;
            ctx.stroke();
            ctx.shadowBlur = 0; 
            
            if (isStriker) {
                ctx.beginPath();
                ctx.arc(x, y, r * 0.4, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.fill();
            } else {
                // Puck (ball) ka dynamic andruni hissa
                ctx.beginPath();
                ctx.arc(x, y, r * 0.5, 0, Math.PI * 2);
                ctx.fillStyle = color;
                // Opacity jo pulse karti hai
                ctx.globalAlpha = 0.6 + Math.sin(timeCount * 15) * 0.4;
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        function draw() {
            // Background color canvas par seedha banayein
            const bgGrad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            bgGrad.addColorStop(0, '#1a1f2b');
            bgGrad.addColorStop(1, '#0f131a');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Synthwave jaisa Grid Background banayein
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            const gridSize = 40;
            let offset = (timeCount * 10) % gridSize;
            
            for(let i = -gridSize; i < canvas.width + gridSize; i += gridSize) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for(let i = -gridSize; i < canvas.height + gridSize; i += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, i + offset); ctx.lineTo(canvas.width, i + offset); ctx.stroke();
            }

            // Ground ki lines banayein
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.lineWidth = 3;
            
            ctx.beginPath();
            ctx.moveTo(0, canvas.height/2);
            ctx.lineTo(canvas.width, canvas.height/2);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.arc(canvas.width/2, canvas.height/2, 50, 0, Math.PI*2);
            ctx.stroke();

            // Goal lines (Red/Blue chamakne wali)
            ctx.lineWidth = 6;
            ctx.shadowBlur = 10;
            
            ctx.shadowColor = '#ff0055';
            ctx.strokeStyle = '#ff0055';
            ctx.beginPath();
            ctx.moveTo(canvas.width/2 - goalWidth/2, 3);
            ctx.lineTo(canvas.width/2 + goalWidth/2, 3);
            ctx.stroke();
            
            ctx.shadowColor = '#00d4ff';
            ctx.strokeStyle = '#00d4ff';
            ctx.beginPath(); 
            ctx.moveTo(canvas.width/2 - goalWidth/2, canvas.height-3);
            ctx.lineTo(canvas.width/2 + goalWidth/2, canvas.height-3);
            ctx.stroke();
            
            ctx.shadowBlur = 0; 

            // Puck ki pooch (Trail) draw karein
            ctx.globalCompositeOperation = 'lighter';
            if(puck.trail.length > 1) {
                ctx.beginPath();
                ctx.moveTo(puck.trail[0].x, puck.trail[0].y);
                for(let i=1; i<puck.trail.length; i++) {
                    ctx.lineTo(puck.trail[i].x, puck.trail[i].y);
                }
                // Bahar ki chamak
                ctx.globalAlpha = 0.4;
                ctx.strokeStyle = puck.color;
                ctx.lineWidth = puck.r * 1.5;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
                
                // Andar ki neon chamak
                ctx.globalAlpha = 1.0;
                ctx.strokeStyle = puck.color;
                ctx.lineWidth = puck.r * 0.5;
                ctx.stroke();
            }
            
            // Chingariyan (Sparks) draw karein
            for(let i=0; i<sparks.length; i++) {
                let s = sparks[i];
                ctx.fillStyle = s.color;
                ctx.globalAlpha = s.life;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;
            ctx.globalCompositeOperation = 'source-over';

            // Players draw karein
            drawGlowingCircle(p1.x, p1.y, p1.r, p1.color, true);
            drawGlowingCircle(p2.x, p2.y, p2.r, p2.color, true);
            
            // Puck draw karein jo size me pulse (chhota-bada) ho rahi hai
            const dynamicRadius = puck.r + Math.sin(timeCount * 12) * 1.5;
            drawGlowingCircle(puck.x, puck.y, dynamicRadius, puck.color, false);
        }

        function loop() {
            if (!gameActive) return;
            update();
            draw();
            animationId = requestAnimationFrame(loop);
        }

        // ==========================================
        // FIXED MULTI-TOUCH / POINTER INPUT ENGINE
        // ==========================================

        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }

        function updatePointerTarget(playerObj, posX, posY) {
            playerObj.targetX = Math.max(playerObj.r, Math.min(posX, canvas.width - playerObj.r));
            playerObj.targetY = Math.max(playerObj.bounds.top + playerObj.r, Math.min(posY, playerObj.bounds.bottom - playerObj.r));
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (!gameActive) return;
            e.preventDefault(); 
            try { canvas.setPointerCapture(e.pointerId); } catch(err) {} 
            
            const pos = getPointerPos(e);
            
            if (pos.y > canvas.height / 2 && p1PointerId === null) {
                p1PointerId = e.pointerId;
                updatePointerTarget(p1, pos.x, pos.y);
            } else if (pos.y <= canvas.height / 2 && p2PointerId === null) {
                p2PointerId = e.pointerId;
                updatePointerTarget(p2, pos.x, pos.y);
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!gameActive) return;
            e.preventDefault();
            const pos = getPointerPos(e);
            
            if (e.pointerId === p1PointerId) updatePointerTarget(p1, pos.x, pos.y);
            if (e.pointerId === p2PointerId) updatePointerTarget(p2, pos.x, pos.y);
        });

        const releasePointer = (e) => {
            if (e.pointerId === p1PointerId) p1PointerId = null;
            if (e.pointerId === p2PointerId) p2PointerId = null;
        };

        canvas.addEventListener('pointerup', releasePointer);
        canvas.addEventListener('pointercancel', releasePointer);
        canvas.addEventListener('pointerout', releasePointer);


        // --- UI Interactions ---
        startBtn.addEventListener('click', () => {
            if (startBtn.innerText === "Khel Jari Rakhein (Resume)") {
                gameActive = true;
                uiOverlay.classList.add('hidden');
                pauseBtn.classList.add('visible');
                cancelAnimationFrame(animationId);
                loop();
            } else {
                startGame();
            }
        });
        
        pauseBtn.addEventListener('click', pauseGame);

        draw();

    </script>
</body>
</html>
